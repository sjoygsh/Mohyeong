name: mohyeong
description: "Mohyeong - manga reader"
publish_to: 'none'

# versionName 1.0.0 / versionCode 31 (Kotlin app last shipped versionCode 30 in v0.19.17).
# Bump versionCode for every release once v1.0 starts shipping.
version: 1.0.0+31

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Database (Drift = type-safe SQL, closest analog to existing SQLDelight).
  # drift_flutter is capped below 0.2.7 because 0.2.7 introduced the
  # `isolateDebugLog` parameter that requires drift 2.28+. Bumping drift
  # past 2.27 cascades into drift_dev >=2.28 needing build ^3.0.0, which
  # conflicts with riverpod_generator 2.x's `build ^2.0.0` pin. Staying on
  # drift 2.21 + drift_flutter 0.2.6 sidesteps both transitive conflicts.
  drift: ^2.21.0
  drift_flutter: ">=0.2.0 <0.2.7"
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.2
  path: ^1.9.0

  # Networking
  dio: ^5.4.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8

  # WebView (for Cloudflare auto-solve reimplementation)
  webview_flutter: ^4.7.0

  # Encrypted credential storage (replaces SyncCrypto.kt — uses Keystore/Keychain)
  flutter_secure_storage: ^9.0.0

  # Background work (replaces WorkManager-based LibraryUpdateJob)
  workmanager: ^0.9.0

  # Plain preferences
  shared_preferences: ^2.2.2

  # File picker (for backup import, local source folder selection)
  file_picker: ^10.3.3

  # Image loading + caching (cover art, reader pages)
  cached_network_image: ^3.3.1
  # Underlying cache store for cached_network_image — declared directly so
  # the advanced "clear cached covers" action can call emptyCache().
  flutter_cache_manager: ^3.3.1

  # Cupertino icons (iOS-style)
  cupertino_icons: ^1.0.8

  # Runtime access to the version: from pubspec (versionName/versionCode)
  # for the About screen.
  package_info_plus: ^8.0.0

  # Opening external URLs (about screen -> source code / changelog).
  url_launcher: ^6.2.0

  # JS runtime for extensions (JavaScriptCore on iOS, QuickJS on Android).
  # Extensions are loaded as JS files and run in a sandboxed context.
  flutter_js: ^0.8.0

  # Keep the screen awake while reading (reader "keep screen on" pref).
  wakelock_plus: ^1.2.5

  # Override screen brightness while reading (reader custom-brightness pref).
  screen_brightness: ^2.1.1

  # Biometric / device-credential app lock (security settings).
  local_auth: ^2.3.0
  archive: ^4.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Drift code generation. Held at 2.21 to match the 2.21 runtime above;
  # drift_dev's minor version must track drift's minor version exactly.
  drift_dev: ^2.21.0
  build_runner: ^2.4.0

  # Riverpod code generation
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.0
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
