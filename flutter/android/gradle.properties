org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Workaround for Windows file-locking issue on non-C: drives — Kotlin's incremental
# cache cannot atomically rename .tab files when AV or the filesystem is slow to
# release file handles. Disabling incremental compilation fixes "Could not close
# incremental caches" errors on `:webview_flutter_android:compileDebugKotlin`.
kotlin.incremental=false

# Several Flutter plugins (flutter_js, file_picker) still hardcode JVM target 1.8/11
# in their own modules. Aligning them all to our app-level JVM 17 via subproject
# overrides is fragile because each plugin re-sets compileOptions during its own
# evaluation. Demoting the cross-task JVM-target mismatch from error to warning
# lets the build proceed — Android compiles each module against its declared
# target and the resulting classes interop fine at runtime.
kotlin.jvm.target.validation.mode=warning
